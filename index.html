<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flipycoin | Free Online Coin Flip</title>
    <meta
      name="description"
      content="Flip a U.S. quarter online with smooth animation, sound, and instant Heads or Tails results. A free coin flipper for quick decisions."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#15803d" />
    <meta name="application-name" content="Flipycoin" />
    <link rel="canonical" href="https://www.flipycoin.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flipycoin" />
    <meta property="og:url" content="https://www.flipycoin.com/" />
    <meta property="og:title" content="Flipycoin | Free Online Coin Flip" />
    <meta
      property="og:description"
      content="Flip a U.S. quarter online with smooth animation, sound, and instant Heads or Tails results."
    />
    <meta property="og:image" content="https://www.flipycoin.com/assets/coin-heads-clean.png" />
    <meta property="og:image:alt" content="A United States quarter showing heads" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flipycoin | Free Online Coin Flip" />
    <meta
      name="twitter:description"
      content="Flip a U.S. quarter online with smooth animation, sound, and instant Heads or Tails results."
    />
    <meta name="twitter:image" content="https://www.flipycoin.com/assets/coin-heads-clean.png" />
    <link rel="preload" href="assets/coin-heads.webp" as="image" type="image/webp" />
    <link rel="preload" href="assets/coin-tails.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Flipycoin",
        "url": "https://www.flipycoin.com/",
        "description": "A free online coin flipper that flips a U.S. quarter and returns Heads or Tails.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <main class="coin-app" aria-labelledby="page-title">
      <section class="flipper" aria-label="Coin flipper">
        <h1 id="page-title">Quarter Flipper</h1>

        <div class="coin-scene" aria-hidden="true">
          <div class="coin" id="coin">
            <div class="coin-face coin-heads">
              <picture>
                <source srcset="assets/coin-heads.webp" type="image/webp" />
                <img src="assets/coin-heads-clean.png" alt="" width="640" height="640" draggable="false" />
              </picture>
            </div>
            <div class="coin-face coin-tails">
              <picture>
                <source srcset="assets/coin-tails.webp" type="image/webp" />
                <img src="assets/coin-tails-clean.png" alt="" width="640" height="640" draggable="false" />
              </picture>
            </div>
          </div>
        </div>

        <p class="result" id="result" role="status" aria-live="polite" aria-atomic="true">
          Flip a U.S. quarter. Heads or Tails?
        </p>
        <button class="flip-button" id="flipButton" type="button" aria-label="Flip coin">
          <span class="button-shade" aria-hidden="true"></span>
          <span class="button-glint" aria-hidden="true"></span>
          <span class="button-content">
            <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M13 2 4 14h7l-1 8 10-13h-7l0-7Z" />
            </svg>
            <span class="sr-only">Flip</span>
          </span>
        </button>

        <div class="action-controls" aria-label="Coin tools">
          <button class="tool-button" id="soundButton" type="button" aria-pressed="false" aria-label="Turn sound off">
            <svg class="tool-icon sound-on-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 9v6h4l5 4V5L8 9H4Z" />
              <path d="M16 8.5a5 5 0 0 1 0 7" />
              <path d="M18.5 6a8.5 8.5 0 0 1 0 12" />
            </svg>
            <svg class="tool-icon sound-off-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 9v6h4l5 4V5L8 9H4Z" />
              <path d="m17 9 4 4" />
              <path d="m21 9-4 4" />
            </svg>
          </button>
          <button class="tool-button" id="resetButton" type="button" aria-label="Reset coin">
            <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v6h-6" />
            </svg>
          </button>
        </div>

        <fieldset class="duration-control" aria-label="Choose spin time">
          <legend>Spin time</legend>
          <label>
            <input type="radio" name="duration" value="3000" checked />
            <span>3 sec</span>
          </label>
          <label>
            <input type="radio" name="duration" value="5000" />
            <span>5 sec</span>
          </label>
          <label>
            <input type="radio" name="duration" value="8000" />
            <span>8 sec</span>
          </label>
          <label>
            <input type="radio" name="duration" value="10000" />
            <span>10 sec</span>
          </label>
        </fieldset>
      </section>
    </main>

    <span class="cursor-loader" aria-hidden="true"></span>
    <audio id="clickSound" src="assets/click-positive.wav" preload="auto"></audio>
    <audio id="resultSound" src="assets/result-achievement.wav" preload="auto"></audio>
    <script src="app.js"></script>
  </body>
</html>
